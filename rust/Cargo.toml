[package]
name = "ipaloader_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
isideload = { version = "0.5.2", default-features = false, features = ["fs-storage", "tokio-mt", "install"] }
idevice = { version = "0.1.68", features = ["usbmuxd"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
plist = "1.8"
rootcause = "0.12"
# isideload 0.5.2 builds its HTTP stack on reqwest's rustls-no-provider
# flavour, so the host process must install a rustls CryptoProvider
# before the first client is constructed (see init_core in lib.rs).
# Version/features align with the rustls 0.23 copy in Cargo.lock.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
# rustls-platform-verifier performs TLS verification through the
# Android platform (via a small Kotlin component in the APK). On
# Android the host must initialize it once with the application
# Context before the first handshake, or verification panics with
# "Expect rustls-platform-verifier to be initialized" — see
# ensure_rpv_init in lib.rs. Its init API is typed against jni 0.22
# (the copy isideload already uses), while this crate's own JNI
# surface is jni 0.21, so jni 0.22 is pulled in under a rename purely
# to bridge the raw pointers at the init call site.
rustls-platform-verifier = "=0.7.1"
jni22 = { package = "jni", version = "=0.22.4" }
# Local proxy (v2 "代打", 0.4.0): the site hands its Apple requests to
# the app, and this client — same reqwest flavour/version and same
# rustls root store (WebPKI + Apple Root CA) as isideload's own
# GrandSlam client — executes them, so Apple sees the login's own TLS
# stack instead of the browser's. Versions unify with the copies
# isideload already pins in Cargo.lock.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
webpki-roots = "0.26"
serde_json = "1"
base64 = "0.21"
# M3 signing (0.5.0): apple-codesign-quick is isideload's own signing
# engine; ipaloader_core uses its ProvisioningProfile parser directly
# to read the signed bundle's embedded profile expiry. zip writes the
# re-zipped output IPA (reading is already in the tree via isideload).
# Both crates are already in Cargo.lock at these exact versions.
apple-codesign-quick = "0.1.0"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Vendored isideload 0.5.2 (pristine crates.io copy in vendor/) with
# exactly one patched area: GrandSlam's reqwest client is built with a
# preconfigured rustls config trusting the WebPKI roots plus the Apple
# Root CA, instead of upstream's add_root_certificate, whose
# platform-verifier code path cannot build a client on Android at all
# (see the comment at the patch site in
# vendor/isideload/src/auth/grandslam.rs).
[patch.crates-io]
isideload = { path = "vendor/isideload" }

[profile.release]
# unwind (not abort) so JNI entry points can catch_unwind a panic and
# turn it into a logged ERR result instead of a process crash.
panic = "unwind"
